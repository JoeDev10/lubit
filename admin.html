<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1530" />
  <meta name="robots" content="noindex" />
  <title>Mi página · Lubit</title>
  <link rel="icon" type="image/jpeg" href="logo.jpeg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,700..900,100&family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --blue: #0b6bff; --blue-deep: #0452cf; --blue-soft: #e6efff;
      --ink: #0b1530; --cream: #f7f4ee; --line: #e7e3da; --muted: #5b6478; --text: #18203a;
      --lime: #d8ff3e; --wa: #1fae5b; --red: #e0503c; --red-soft: #fdecea;
      --display: 'Fraunces', Georgia, serif; --body: 'Onest', system-ui, sans-serif;
    }
    [hidden] { display: none !important; }
    html { -webkit-text-size-adjust: 100%; }
    body { font-family: var(--body); background: var(--cream); color: var(--text); min-height: 100vh; font-size: 16px; }
    button, input, select, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; }
    h1, h2, h3 { font-family: var(--display); font-variation-settings: 'SOFT' 100; color: var(--ink); letter-spacing: -.02em; line-height: 1.1; }

    /* ---------- PIN ---------- */
    #pinScreen { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; background: var(--blue); padding: 24px; }
    .pin-card { width: 100%; max-width: 360px; text-align: center; color: #fff; }
    .pin-card img { width: 72px; height: 72px; border-radius: 20px; margin: 0 auto 20px; box-shadow: 0 10px 30px rgba(0,0,0,.25); border: 3px solid #fff; }
    .pin-card h1 { color: #fff; font-size: 2rem; margin-bottom: 6px; }
    .pin-card p { opacity: .85; margin-bottom: 28px; }
    .pin-dots { display: flex; justify-content: center; gap: 16px; margin-bottom: 14px; }
    .pin-dots span { width: 18px; height: 18px; border-radius: 50%; border: 2.5px solid #fff; transition: background .15s, transform .15s; }
    .pin-dots span.on { background: #fff; transform: scale(1.1); }
    .pin-dots.shake { animation: shake .4s; }
    @keyframes shake { 20%, 60% { transform: translateX(-10px); } 40%, 80% { transform: translateX(10px); } }
    .pin-msg { min-height: 24px; font-weight: 600; margin-bottom: 18px; color: var(--lime); }
    .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
    .keypad button {
      height: 72px; border-radius: 22px; border: 0; background: rgba(255,255,255,.16); color: #fff;
      font-size: 1.7rem; font-weight: 600; transition: background .1s, transform .1s;
      -webkit-tap-highlight-color: transparent;
    }
    .keypad button:active { background: rgba(255,255,255,.34); transform: scale(.95); }
    .keypad .k-muted { background: transparent; font-size: 1.2rem; }
    .pin-back { display: inline-block; margin-top: 26px; color: #fff; opacity: .8; font-weight: 600; text-decoration: none; }

    /* ---------- Panel ---------- */
    #panel { padding-bottom: 120px; }
    .top {
      position: sticky; top: 0; z-index: 30; background: var(--ink); color: #fff;
      padding: 12px 16px; padding-top: max(12px, env(safe-area-inset-top));
      display: flex; align-items: center; gap: 12px;
    }
    .top img { width: 36px; height: 36px; border-radius: 10px; }
    .top .t-title { font-weight: 700; flex: 1; min-width: 0; }
    .top .t-title small { display: block; font-weight: 500; opacity: .7; font-size: .78rem; }
    .top a, .top button.t-btn {
      background: rgba(255,255,255,.12); color: #fff; border: 0; border-radius: 999px;
      padding: 9px 14px; font-weight: 600; font-size: .88rem; text-decoration: none; display: inline-flex; gap: 8px; align-items: center;
    }
    .back-btn { background: rgba(255,255,255,.12); border: 0; color: #fff; width: 40px; height: 40px; border-radius: 12px; font-size: 1rem; }

    .wrap { max-width: 760px; margin: 0 auto; padding: 22px 16px; }
    .hello h1 { font-size: 2rem; margin-bottom: 6px; }
    .hello p { color: var(--muted); margin-bottom: 22px; }

    .tiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .tile {
      background: #fff; border: 1px solid var(--line); border-radius: 22px; padding: 18px; text-align: left;
      display: flex; flex-direction: column; gap: 12px; min-height: 140px; transition: transform .15s, box-shadow .15s;
    }
    .tile:active { transform: scale(.98); }
    .tile:hover { box-shadow: 0 10px 30px -12px rgba(11,21,48,.3); }
    .tile i { width: 48px; height: 48px; border-radius: 14px; display: grid; place-items: center; font-size: 1.25rem; background: var(--blue-soft); color: var(--blue); }
    .tile.main { grid-column: 1 / -1; background: var(--blue); color: #fff; border-color: var(--blue); min-height: 0; flex-direction: row; align-items: center; }
    .tile.main i { background: rgba(255,255,255,.18); color: #fff; }
    .tile.main strong { color: #fff; }
    .tile.main span { color: rgba(255,255,255,.85); }
    .tile strong { font-size: 1.1rem; color: var(--ink); display: block; }
    .tile span { font-size: .88rem; color: var(--muted); }

    .view-head { margin-bottom: 18px; }
    .view-head h2 { font-size: 1.8rem; }
    .view-head p { color: var(--muted); margin-top: 6px; }

    .card { background: #fff; border: 1px solid var(--line); border-radius: 20px; padding: 18px; margin-bottom: 12px; }
    .field { display: grid; gap: 7px; margin-bottom: 16px; }
    .field:last-child { margin-bottom: 0; }
    .field label, .label { font-weight: 700; font-size: .95rem; color: var(--ink); }
    .field small, .hint { color: var(--muted); font-size: .84rem; font-weight: 500; }
    .field input, .field textarea, .field select {
      width: 100%; padding: 14px 16px; border-radius: 14px; border: 2px solid var(--line); background: var(--cream);
      font-size: 1rem; transition: border-color .15s, background .15s;
    }
    .field textarea { min-height: 96px; resize: vertical; line-height: 1.5; }
    .field input:focus, .field textarea:focus, .field select:focus { outline: none; border-color: var(--blue); background: #fff; }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chips button {
      padding: 10px 16px; border-radius: 999px; border: 2px solid var(--line); background: #fff; font-weight: 600; font-size: .95rem;
    }
    .chips button.on { background: var(--ink); border-color: var(--ink); color: #fff; }

    .add-btn {
      width: 100%; padding: 18px; border-radius: 20px; border: 2.5px dashed #b9cdf3; background: transparent;
      color: var(--blue); font-weight: 700; font-size: 1.05rem; display: flex; align-items: center; justify-content: center; gap: 10px;
    }
    .add-btn:active { background: var(--blue-soft); }
    .add-btn.big { background: var(--blue); color: #fff; border: 0; padding: 20px; margin-bottom: 16px; box-shadow: 0 10px 24px -10px rgba(11,107,255,.7); }

    .del-btn { background: none; border: 0; color: var(--red); font-weight: 700; display: inline-flex; gap: 8px; align-items: center; padding: 8px 0; }

    /* Lista de celulares */
    .p-row { display: flex; align-items: center; gap: 14px; background: #fff; border: 1px solid var(--line); border-radius: 20px; padding: 12px; margin-bottom: 10px; }
    .p-thumb { width: 68px; height: 68px; border-radius: 14px; object-fit: cover; background: #eef1f7; flex-shrink: 0; display: grid; place-items: center; color: #b4bdd2; font-size: 1.6rem; overflow: hidden; }
    .p-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .p-info { flex: 1; min-width: 0; text-align: left; background: none; border: 0; padding: 0; }
    .p-info strong { display: block; color: var(--ink); font-size: 1.05rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .p-info span { color: var(--muted); font-size: .9rem; }
    .p-info .p-edit { color: var(--blue); font-weight: 700; font-size: .85rem; display: inline-flex; gap: 6px; align-items: center; margin-top: 2px; }
    .p-row.sold { opacity: .65; }

    /* Interruptor */
    .switch { display: flex; flex-direction: column; align-items: center; gap: 4px; background: none; border: 0; font-size: .72rem; font-weight: 700; color: var(--muted); flex-shrink: 0; }
    .switch .track { width: 52px; height: 30px; border-radius: 999px; background: var(--wa); position: relative; transition: background .2s; }
    .switch .track::after { content: ''; position: absolute; top: 3px; left: 25px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: left .2s; box-shadow: 0 1px 3px rgba(0,0,0,.3); }
    .switch.off .track { background: #c4c9d6; }
    .switch.off .track::after { left: 3px; }

    /* Hoja de edición */
    .sheet { position: fixed; inset: 0; z-index: 40; background: var(--cream); overflow-y: auto; animation: up .25s ease; }
    @keyframes up { from { transform: translateY(30px); opacity: 0; } }
    .sheet-foot {
      position: sticky; bottom: 0; background: linear-gradient(180deg, rgba(247,244,238,0), var(--cream) 30%);
      padding: 20px 16px; padding-bottom: max(20px, env(safe-area-inset-bottom));
    }
    .sheet-foot .wrap { padding: 0; }

    /* Fotos */
    .photos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .ph { position: relative; aspect-ratio: 1; border-radius: 16px; overflow: hidden; background: #eef1f7; }
    .ph img { width: 100%; height: 100%; object-fit: cover; }
    .ph .ph-x, .ph .ph-star {
      position: absolute; top: 6px; width: 32px; height: 32px; border-radius: 50%; border: 0;
      background: rgba(11,21,48,.75); color: #fff; display: grid; place-items: center; font-size: .85rem;
    }
    .ph .ph-x { right: 6px; }
    .ph .ph-star { left: 6px; }
    .ph .ph-cover { position: absolute; left: 6px; bottom: 6px; background: var(--lime); color: var(--ink); font-size: .7rem; font-weight: 800; padding: 3px 8px; border-radius: 999px; }
    .ph .ph-load { position: absolute; inset: 0; background: rgba(11,21,48,.55); display: grid; place-items: center; color: #fff; font-size: 1.4rem; }
    .ph-add { aspect-ratio: 1; border-radius: 16px; border: 2.5px dashed #b9cdf3; background: #fff; color: var(--blue); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font-weight: 700; font-size: .85rem; }
    .ph-add i { font-size: 1.6rem; }

    .icons { display: flex; flex-wrap: wrap; gap: 8px; }
    .icons button { width: 48px; height: 48px; border-radius: 14px; border: 2px solid var(--line); background: #fff; color: var(--blue); font-size: 1.1rem; }
    .icons button.on { background: var(--blue); color: #fff; border-color: var(--blue); }

    .item-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
    .item-head strong { color: var(--ink); }

    /* Barra de guardar */
    .savebar {
      position: fixed; left: 12px; right: 12px; bottom: 12px; bottom: max(12px, env(safe-area-inset-bottom)); z-index: 35;
      max-width: 736px; margin: 0 auto; background: var(--ink); color: #fff; border-radius: 22px; padding: 12px 12px 12px 20px;
      display: flex; align-items: center; gap: 12px; box-shadow: 0 20px 50px -10px rgba(11,21,48,.5); animation: up .25s ease;
    }
    .savebar span { flex: 1; font-weight: 600; font-size: .95rem; }
    .btn-save { background: var(--wa); color: #fff; border: 0; border-radius: 16px; padding: 14px 22px; font-weight: 800; font-size: 1rem; display: inline-flex; gap: 8px; align-items: center; }
    .btn-save:disabled { opacity: .7; }
    .btn-done { width: 100%; background: var(--ink); color: #fff; border: 0; border-radius: 18px; padding: 18px; font-weight: 800; font-size: 1.05rem; }

    .toast {
      position: fixed; top: 16px; left: 50%; transform: translate(-50%, -120px); z-index: 100; transition: transform .3s ease;
      background: var(--ink); color: #fff; padding: 14px 20px; border-radius: 16px; font-weight: 600; max-width: calc(100% - 32px);
      display: flex; gap: 10px; align-items: center; box-shadow: 0 16px 40px -10px rgba(11,21,48,.5);
    }
    .toast.show { transform: translate(-50%, 0); }
    .toast.ok i { color: var(--lime); }
    .toast.err { background: var(--red); }

    .loading { text-align: center; padding: 60px 0; color: var(--muted); }
    .demo-banner { background: var(--lime); color: var(--ink); text-align: center; font-weight: 700; font-size: .85rem; padding: 8px 12px; }

    @media (max-width: 420px) {
      .row2 { grid-template-columns: 1fr; }
      .tile { min-height: 124px; padding: 16px; }
    }
  </style>
</head>
<body>

<!-- ================= PIN ================= -->
<section id="pinScreen">
  <div class="pin-card">
    <img src="logo.jpeg" alt="Lubit" />
    <h1>Mi página</h1>
    <p>Ingresá tu PIN para editar la web</p>
    <div class="pin-dots" id="pinDots"><span></span><span></span><span></span><span></span></div>
    <div class="pin-msg" id="pinMsg" role="alert"></div>
    <div class="keypad" id="keypad">
      <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
      <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
      <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
      <button class="k-muted" data-k="clear" aria-label="Borrar todo">Borrar</button>
      <button data-k="0">0</button>
      <button class="k-muted" data-k="back" aria-label="Borrar último"><i class="fa-solid fa-delete-left"></i></button>
    </div>
    <a class="pin-back" href="./"><i class="fa-solid fa-arrow-left"></i> Volver a la página</a>
  </div>
</section>

<!-- ================= PANEL ================= -->
<section id="panel" hidden>
  <div class="demo-banner" id="demoBanner" hidden>Modo prueba: los cambios no se guardan de verdad</div>
  <header class="top">
    <button class="back-btn" id="btnBack" hidden aria-label="Volver"><i class="fa-solid fa-arrow-left"></i></button>
    <img src="logo.jpeg" alt="" id="topLogo" />
    <div class="t-title" id="topTitle">Lubit<small>Panel de tu página</small></div>
    <a href="./" target="_blank" rel="noopener"><i class="fa-solid fa-eye"></i> <span>Ver página</span></a>
    <button class="t-btn" id="btnSalir" aria-label="Salir"><i class="fa-solid fa-right-from-bracket"></i></button>
  </header>
  <main class="wrap" id="view"><div class="loading"><i class="fa-solid fa-spinner fa-spin"></i> Cargando…</div></main>
</section>

<div class="savebar" id="savebar" hidden>
  <span><i class="fa-solid fa-circle-exclamation"></i> Tenés cambios sin guardar</span>
  <button class="btn-save" id="btnGuardar"><i class="fa-solid fa-check"></i> Guardar</button>
</div>

<div class="toast" id="toast"></div>
<input type="file" id="filePicker" accept="image/*" multiple hidden />

<script>
// =========================================================
// CONFIGURACIÓN
// =========================================================
// Dirección de la API: función de Supabase que pide solo el PIN.
// Los datos se guardan en la base (tabla lubit_sitio) y las fotos en el bucket "lubit".
const API = 'https://qpxqrtcceemdbbkdymjl.supabase.co/functions/v1/lubit-admin';
const SESION_KEY = 'lubit_sesion';
const PIN_LEN = 4;

const MARCAS = [['samsung', 'Samsung'], ['apple', 'Apple'], ['motorola', 'Motorola'], ['xiaomi', 'Xiaomi'], ['otro', 'Otra']];
const ESTADOS = ['Nuevo', 'Usado', 'Reacondicionado'];
const ETIQUETAS = [['', 'Ninguna'], ['Hot', '🔥 Más vendido'], ['Oferta', 'Oferta']];
const ICONOS = ['fa-solid fa-display', 'fa-solid fa-battery-full', 'fa-solid fa-plug', 'fa-solid fa-camera', 'fa-solid fa-droplet-slash',
  'fa-solid fa-microchip', 'fa-solid fa-volume-high', 'fa-solid fa-microphone', 'fa-solid fa-wifi', 'fa-solid fa-lock-open',
  'fa-solid fa-mobile-screen', 'fa-solid fa-screwdriver-wrench', 'fa-solid fa-hand-pointer', 'fa-solid fa-sim-card', 'fa-solid fa-tablet-screen-button'];

let sesion = null;
let datos = null;
let repo = 'joedev10/lubit', rama = 'master';
let sucio = false;
let demo = false;
let subiendo = 0;

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function toast(msg, tipo = 'ok') {
  const t = $('#toast');
  const ic = { ok: 'fa-circle-check', err: 'fa-circle-xmark', info: 'fa-circle-info' }[tipo];
  t.className = `toast ${tipo}`;
  t.innerHTML = `<i class="fa-solid ${ic}"></i> ${esc(msg)}`;
  requestAnimationFrame(() => t.classList.add('show'));
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove('show'), tipo === 'err' ? 5000 : 3000);
}

// =========================================================
// API
// =========================================================
async function api(accion, extra = {}) {
  if (demo) return apiDemo(accion, extra);
  let res;
  try {
    res = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ accion, sesion, ...extra }) });
  } catch {
    throw new Error('Sin conexión. Revisá internet y probá de nuevo.');
  }
  // Probando en la compu sin la API: modo prueba
  const esJson = (res.headers.get('content-type') || '').includes('application/json');
  if (!esJson && /^(localhost|127\.0\.0\.1)$/.test(location.hostname)) { demo = true; return apiDemo(accion, extra); }
  const data = await res.json().catch(() => ({}));
  if (data.sesion === false) { cerrarSesion(); throw new Error(data.error); }
  if (!res.ok) throw new Error(data.error || 'Algo salió mal');
  return data;
}

async function apiDemo(accion, extra) {
  await new Promise(r => setTimeout(r, 350));
  if (accion === 'entrar') {
    if (extra.pin !== '1234') throw new Error('PIN incorrecto');
    return { sesion: 'demo', repo, rama };
  }
  if (accion === 'leer') { const r = await fetch('datos.json?t=' + Date.now()); return { datos: await r.json(), repo, rama }; }
  if (accion === 'foto') return { ruta: extra.base64 };
  return { ok: true };
}

// =========================================================
// PIN
// =========================================================
let pin = '';
function pintarPin() { [...$('#pinDots').children].forEach((d, i) => d.classList.toggle('on', i < pin.length)); }
async function teclaPin(k) {
  if (k === 'back') pin = pin.slice(0, -1);
  else if (k === 'clear') pin = '';
  else if (pin.length < PIN_LEN) pin += k;
  $('#pinMsg').textContent = '';
  pintarPin();
  if (pin.length === PIN_LEN) {
    $('#pinMsg').innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
    try {
      const r = await api('entrar', { pin });
      sesion = r.sesion;
      try { localStorage.setItem(SESION_KEY, sesion); } catch {}
      entrar();
    } catch (e) {
      $('#pinMsg').textContent = e.message;
      $('#pinDots').classList.add('shake');
      setTimeout(() => $('#pinDots').classList.remove('shake'), 400);
      if (navigator.vibrate) navigator.vibrate(120);
    }
    pin = ''; pintarPin();
  }
}
$('#keypad').addEventListener('click', e => { const b = e.target.closest('button'); if (b) teclaPin(b.dataset.k); });
document.addEventListener('keydown', e => {
  if ($('#pinScreen').hidden) return;
  if (/^\d$/.test(e.key)) teclaPin(e.key);
  if (e.key === 'Backspace') teclaPin('back');
});

function cerrarSesion() {
  try { localStorage.removeItem(SESION_KEY); } catch {}
  sesion = null;
  $('#panel').hidden = true; $('#savebar').hidden = true; $('#pinScreen').hidden = false;
}
$('#btnSalir').addEventListener('click', () => {
  if (sucio && !confirm('Tenés cambios sin guardar. ¿Salir igual?')) return;
  sucio = false; cerrarSesion();
});

async function entrar() {
  $('#pinScreen').hidden = true;
  $('#panel').hidden = false;
  $('#demoBanner').hidden = !demo;
  try {
    const r = await api('leer');
    datos = normalizar(r.datos);
    repo = r.repo || repo; rama = r.rama || rama;
    ir('inicio');
  } catch (e) {
    $('#view').innerHTML = `<div class="loading">${esc(e.message)}</div>`;
  }
}

function normalizar(d) {
  d = d || {};
  d.negocio = Object.assign({ titulo: '', subtitulo: '', aviso: '', stats: [], instagram: '', facebook: '', pagos: '' }, d.negocio);
  while (d.negocio.stats.length < 3) d.negocio.stats.push({ numero: '', texto: '' });
  d.contacto = Object.assign({ direccion: '', localidad: '', whatsapp: '', email: '', horario: '' }, d.contacto);
  d.reparaciones = d.reparaciones || [];
  d.productos = (d.productos || []).map(p => Object.assign({ nombre: '', marca: 'samsung', condicion: '', almacenamiento: '', bateria: '', descripcion: '', precio: '', cuotas: '', badge: '', vendido: false, fotos: [] }, p));
  d.testimonios = d.testimonios || [];
  d.faq = d.faq || [];
  return d;
}

// =========================================================
// GUARDAR
// =========================================================
function marcarCambio() { sucio = true; $('#savebar').hidden = false; }
async function guardar() {
  if (subiendo) { toast('Esperá a que terminen de subir las fotos', 'info'); return; }
  const btn = $('#btnGuardar');
  btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Guardando';
  try {
    const limpio = JSON.parse(JSON.stringify(datos));
    limpio.productos = limpio.productos.filter(p => p.nombre.trim());
    limpio.faq = limpio.faq.filter(f => f.pregunta.trim());
    limpio.testimonios = limpio.testimonios.filter(t => t.texto.trim());
    limpio.reparaciones = limpio.reparaciones.filter(r => r.titulo.trim());

// Helper: crea un campo de texto ligado a un objeto
function campo({ label, obj, key, placeholder = '', hint = '', tipo = 'text', area = false, inputmode = '' }) {
  const f = document.createElement('div');
  f.className = 'field';
  const id = 'f' + Math.random().toString(36).slice(2, 8);
  f.innerHTML = `<label for="${id}">${esc(label)}</label>` +
    (area ? `<textarea id="${id}" placeholder="${esc(placeholder)}"></textarea>`
          : `<input id="${id}" type="${tipo}" placeholder="${esc(placeholder)}" ${inputmode ? `inputmode="${inputmode}"` : ''} />`) +
    (hint ? `<small>${esc(hint)}</small>` : '');
  const input = f.querySelector('input, textarea');
  input.value = obj[key] ?? '';
  input.addEventListener('input', () => { obj[key] = input.value; marcarCambio(); });
  return f;
}

function chips(opciones, valor, onChange) {
  const c = document.createElement('div');
  c.className = 'chips';
  opciones.forEach(([v, l]) => {
    const b = document.createElement('button');
    b.type = 'button'; b.textContent = l; b.classList.toggle('on', v === valor);
    b.onclick = () => { [...c.children].forEach(x => x.classList.toggle('on', x === b)); onChange(v); marcarCambio(); };
    c.appendChild(b);
  });
  return c;
}

function bloque(label, el, hint) {
  const f = document.createElement('div');
  f.className = 'field';
  f.innerHTML = `<span class="label">${esc(label)}</span>`;
  f.appendChild(el);
  if (hint) f.insertAdjacentHTML('beforeend', `<small>${esc(hint)}</small>`);
  return f;
}

function fotoSrc(ruta) {
  if (!ruta) return '';
  if (/^(https?:|data:|blob:)/.test(ruta)) return ruta;
  return ruta; // ruta relativa; si todavía no se publicó, se usa la copia de GitHub (ver onerror)
}
function fotoFallback(img, ruta) {
  img.onerror = () => { img.onerror = null; img.src = `https://raw.githubusercontent.com/${repo}/${rama}/${ruta}`; };
}

    const actual = $('#pinActual').value, nuevo = $('#pinNuevo').value, rep = $('#pinRepetir').value;

// ---------- Subida de fotos ----------
function elegirFotos(p, grid, repintar) {
  const picker = $('#filePicker');
  picker.value = '';
  picker.onchange = async () => {
    const files = [...picker.files].slice(0, 10 - p.fotos.length);
    if (picker.files.length > files.length) toast('Máximo 10 fotos por celular', 'info');
    for (const file of files) {
      // Tarjeta "subiendo" mientras tanto
      const ph = document.createElement('div');
      ph.className = 'ph';
      const local = URL.createObjectURL(file);
      ph.innerHTML = `<img src="${local}" alt="" /><div class="ph-load"><i class="fa-solid fa-spinner fa-spin"></i></div>`;
      grid.insertBefore(ph, grid.lastElementChild);
      subiendo++;
      try {
        const { base64, tipo } = await comprimir(file);
        const { ruta } = await api('foto', { base64, tipo });
        p.fotos.push(ruta);
        marcarCambio();
      } catch (e) {
        toast('No se pudo subir una foto: ' + e.message, 'err');
      } finally {
        subiendo--;
      }
    }
    repintar();
    if (files.length) toast(files.length === 1 ? 'Foto agregada' : `${files.length} fotos agregadas`);
  };
  picker.click();
}

// Achica la foto del celular (pueden pesar 5-10 MB) a algo liviano para la web
async function comprimir(file, max = 1600, calidad = 0.82) {
  const bitmap = await (window.createImageBitmap
    ? createImageBitmap(file, { imageOrientation: 'from-image' }).catch(() => null)
    : null);
  let img = bitmap;
  if (!img) {
    img = await new Promise((ok, err) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => err(new Error('Formato de imagen no soportado')); i.src = URL.createObjectURL(file); });
  }
  const w = img.width, h = img.height;
  const escala = Math.min(1, max / Math.max(w, h));
  const canvas = document.createElement('canvas');
  canvas.width = Math.round(w * escala); canvas.height = Math.round(h * escala);
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
  const dataUrl = canvas.toDataURL('image/jpeg', calidad);
  return { base64: dataUrl, tipo: 'image/jpeg' };
}

    card.querySelector('.item-head').appendChild(del);
    campos.forEach(cf => card.appendChild(campo({ ...cf, obj: item })));
    v.appendChild(card);
  });
  const add = document.createElement('button'); add.className = 'add-btn'; add.innerHTML = `<i class="fa-solid fa-plus"></i> ${esc(textoAgregar)}`;
  add.onclick = () => { arr.push(nuevo()); marcarCambio(); ir(vista); window.scrollTo(0, document.body.scrollHeight); };
  v.appendChild(add);
}

    ]
  });

}
